# A pod for every tab, so that every phone in a room has something to
# show. A DaemonSet makes one pod for each node its pods could run on,
# and takes the pod away with the node: here, one for each tab.
#
#   kubectl apply -f everywhere.yaml
#
# The pod names the tabs' label and tolerates their taint itself. The
# RuntimeClass would add both when the pod is made, which is too late
# for the DaemonSet: it decides which nodes get a pod from the pod's
# template, and would make one for the cluster's own machine too.
#
# A tab whose one place went to a pod that comes first (counter.yaml)
# has its pod of this DaemonSet waiting as Pending.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: everywhere
spec:
  selector:
    matchLabels:
      app: everywhere
  template:
    metadata:
      labels:
        app: everywhere
    spec:
      runtimeClassName: tab
      nodeSelector:
        tabernetes.dev/tab: "true"
      tolerations:
        - key: tabernetes.dev/tab
          operator: Exists
          effect: NoSchedule
      containers:
        - name: everywhere
          image: alpine:3.22
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              echo "Linux $(uname -r) on $(uname -m), in the tab that is node $NODE_NAME"
              while true; do date; sleep 10; done
