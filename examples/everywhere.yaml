# A pod for every tab there is room for, so that every phone in a room
# has something to show. The Deployment asks for as many pods as the
# cluster takes nodes; the ones with no tab to run in wait as Pending,
# and each tab that joins takes one.
#
#   kubectl apply -f everywhere.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: everywhere
spec:
  replicas: 100
  selector:
    matchLabels:
      app: everywhere
  template:
    metadata:
      labels:
        app: everywhere
    spec:
      runtimeClassName: tab
      containers:
        - name: everywhere
          image: alpine:3.22
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              echo "Linux $(uname -r) on $(uname -m), in the tab that is node $NODE_NAME"
              while true; do date; sleep 10; done
