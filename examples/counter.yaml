# A counter that every tab serves: a web server on each tab, and the
# Redis they count visits in on one of them.
#
#   kubectl apply -f counter.yaml
#   curl $(kubectl get svc web -o jsonpath='{.spec.clusterIP}'):8000
#
# Each answer says which node's pod gave it, and the pod says so too,
# in its own tab: whoever holds the phone sees a line for every request
# the phone answered. With the agent started with
# `--expose counter=default/web:8000`, the site's "Ask the cluster"
# button sends its visitors' requests here.
#
# The web server also renders tiles of a picture, one for each request
# that names one. examples/picture.yaml has the painter that asks every
# tab for tiles and puts the picture together.
#
# The web server is a DaemonSet, so every tab that joins gets one and
# is behind the Service a few seconds later. It is a shell script: the
# image is Alpine's 4 MB and nothing is installed, which matters when
# every phone that joins fetches the files it runs.
#
# Redis keeps its data on the cluster's machine, since a pod's volumes
# live there and not in the tab. Close the tab Redis runs in and
# Kubernetes starts Redis in another tab, where it reads the same file,
# and the count goes on from where it was.
#
# Redis comes before the web servers: a tab has room for one pod, so
# Redis takes a tab from a web server when there is no tab free.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: tab-first
value: 1000
description: Pods that should get a tab before the pods every tab gets.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      # The tab that runs Redis may open a shell in the pod, as a user
      # who can read nothing of the volume and write nothing to it.
      annotations:
        tabernetes.dev/shell: nobody
    spec:
      runtimeClassName: tab
      priorityClassName: tab-first
      containers:
        - name: redis
          image: redis:alpine
          # Every write goes to the file as it is made, so a tab that
          # closes mid-count loses nothing. Any pod on a tab can reach
          # Redis, and a tab is a stranger's browser, so Redis is told
          # how much it may hold: a stranger can spoil the count and
          # cannot fill the machine.
          args:
            - --appendonly
            - "yes"
            - --appendfsync
            - always
            - --dir
            - /data
            - --maxmemory
            - 64mb
            - --maxmemory-policy
            - allkeys-lru
            # Nobody who connects has a password, since a pod on a tab
            # can keep no secret. So whoever connects may count a visit
            # and read the count, and do nothing else: no other key, and
            # no command that empties Redis or changes its settings.
            - --user
            - default
            - "on"
            - nopass
            - "~visits"
            - "-@all"
            - "+incr"
            - "+get"
            - "+ping"
            - "+quit"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/tabernetes/data/redis
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      # The tab that runs the pod may open a shell in it, which is the
      # tab's own Linux to look around in. Whatever the shell writes
      # stays in the tab's memory.
      annotations:
        tabernetes.dev/shell: nobody
    spec:
      runtimeClassName: tab
      # A DaemonSet decides which nodes get a pod from the pod's
      # template, before the RuntimeClass adds the tabs' label and
      # toleration to the pod. So the template names both itself, and
      # the cluster's own machine gets no pod.
      nodeSelector:
        tabernetes.dev/tab: "true"
      tolerations:
        - key: tabernetes.dev/tab
          operator: Exists
          effect: NoSchedule
      containers:
        - name: web
          image: alpine:3.22
          ports:
            - containerPort: 8000
          # The Service sends a pod nothing until the server in it
          # answers.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - sh
            - -c
            - |
              # What answers one request: the visit is counted in
              # Redis, spoken to in its own protocol over a socket, and
              # the answer says which node gave it. nc runs this once
              # for each connection, with the connection as its input
              # and output, so what is written to the terminal goes to
              # file descriptor 2.
              cat > /answer <<'ANSWER'
              #!/bin/sh
              read -r method path version

              # The rest of the request, to the empty line that ends
              # the headers. A connection that is closed with something
              # unread is reset, and the reset can reach the other end
              # before the answer does.
              ended=$(printf '\r')
              while read -r header && [ -n "$header" ] && [ "$header" != "$ended" ]; do
                :
              done

              reply() {
                printf 'HTTP/1.1 %s\r\nContent-Type: %s\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s' \
                  "$1" "$2" "${#3}" "$3"
              }

              # The readiness probe's question, which is no visit.
              if [ "$path" = /healthz ]; then
                reply "200 OK" text/plain ""
                exit
              fi

              # What this pod has done since it started, which is no
              # visit either: how many visits it answered and how many
              # tiles it rendered. Each was counted as one byte in a
              # file, so the count is the file's length.
              if [ "$path" = /tally ]; then
                reply "200 OK" application/json "{\"answered\": $(wc -c < /tmp/answered), \"tiles\": $(wc -c < /tmp/tiles)}"
                exit
              fi

              # A tile of a picture, which is no visit either. The path
              # is /tile/<picture>/<tiles to a side>/<tile>, and each
              # of the three is a number.
              number() {
                case "$1" in
                "" | *[!0-9]* | 0?* | ???????*) return 1 ;;
                esac
              }
              if [ "${path#/tile/}" != "$path" ]; then
                # The path's parts, the first of which is the nothing
                # before the first slash.
                parts=$IFS
                IFS=/
                set -f
                set -- $path
                set +f
                IFS=$parts
                picture=$3
                side=$4
                tile=$5
                if [ $# -eq 5 ] && number "$picture" && number "$side" && number "$tile" &&
                  pixels=$(awk -v picture="$picture" -v side="$side" -v tile="$tile" -f /tile.awk); then
                  reply "200 OK" application/json "{\"node\": \"$NODE_NAME\", \"pixels\": \"$pixels\"}"
                  printf . >> /tmp/tiles
                  echo "tile $((tile + 1)) of $((side * side)) rendered here" >&2
                else
                  reply "404 Not Found" text/plain "no such tile"
                fi
                exit
              fi

              visit=$(printf 'INCR visits\r\nQUIT\r\n' | nc -w 5 redis 6379 | head -n 1 | tr -dc 0-9)
              if [ -z "$visit" ]; then
                reply "503 Service Unavailable" text/plain "Redis did not answer"
                echo "Redis did not answer a request" >&2
                exit
              fi
              if [ "$path" = /json ]; then
                reply "200 OK" application/json "{\"visit\": $visit, \"node\": \"$NODE_NAME\", \"pod\": \"$POD_NAME\"}"
              else
                reply "200 OK" text/plain "visit $visit, answered by a pod on $NODE_NAME
              "
              fi
              printf . >> /tmp/answered
              echo "visit $visit answered here" >&2
              ANSWER
              chmod +x /answer

              # What renders one tile: the part of a picture of the
              # Mandelbrot set that the tile covers, as two hex digits
              # for each pixel, row after row. The digits are how many
              # turns the pixel's point took to leave, or ff for a point
              # that stayed.
              #
              # The request names the picture, how many tiles the
              # picture has to a side, and the tile. How many pixels a
              # tile has and how many turns a point is given are fixed
              # here, since they are what a tile costs and the
              # processor is the phone's: about a second for the
              # dearest tile.
              cat > /tile.awk <<'TILE'
              BEGIN {
                PIXELS = 12
                TURNS = 64
                SIDE_MOST = 16
                STAYED = "ff"

                # The pictures, each as the x and the y of the centre
                # and the width. A picture's number picks one, going
                # round the list.
                pictures = split("-0.65 0 2.7;-0.16 1.03 0.25;-0.1 0.75 0.8;-1.76 0 0.12", places, ";")
                if (side < 1 || side > SIDE_MOST || tile < 0 || tile >= side * side) {
                  exit 1
                }
                split(places[picture % pictures + 1], place, " ")

                # The tile's top left corner, and the width of a pixel.
                step = place[3] / (side * PIXELS)
                left = place[1] - place[3] / 2 + (tile % side) * PIXELS * step
                top = place[2] - place[3] / 2 + int(tile / side) * PIXELS * step

                for (row = 0; row < PIXELS; row++) {
                  for (column = 0; column < PIXELS; column++) {
                    a = left + (column + 0.5) * step
                    b = top + (row + 0.5) * step

                    # A point in the heart or in the disc to the left
                    # of the heart stays, and a formula for each shape
                    # tells without turning the point TURNS times.
                    q = (a - 0.25) * (a - 0.25) + b * b
                    if (q * (q + a - 0.25) <= 0.25 * b * b || (a + 1) * (a + 1) + b * b <= 0.0625) {
                      pixels = pixels STAYED
                      continue
                    }

                    x = 0
                    y = 0
                    turns = 0
                    while (turns < TURNS && x * x + y * y < 4) {
                      next_x = x * x - y * y + a
                      y = 2 * x * y + b
                      x = next_x
                      turns++
                    }
                    pixels = pixels (turns < TURNS ? sprintf("%02x", turns) : STAYED)
                  }
                }
                print pixels
              }
              TILE

              # The files the pod's tally is counted in, empty to
              # begin with.
              : > /tmp/answered
              : > /tmp/tiles

              # What the tab's terminal opens with. A phone's terminal is
              # about 36 columns wide and breaks a longer line in the middle
              # of a word, so no line here, and no line /answer writes to
              # the terminal, is longer than 32 columns.
              cat <<BANNER
              Linux $(uname -r) on $(uname -m),
              booted in a browser tab.
              This tab is the node
              $NODE_NAME.

              This pod is a web server behind
              the cluster's Service "web".

              When someone presses "Send a
              request" on the cluster's page
              and the Service picks this pod,
              this device answers. "Render a
              picture" has this device render
              some of the picture's tiles.

              Each request and each tile adds
              a line below.

              BANNER
              exec nc -lk -p 8000 -e /answer
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 8000
