# A web server that counts its visits in Redis, each in a browser tab.
#
#   kubectl apply -f counter.yaml
#   curl $(kubectl get svc web -o jsonpath='{.spec.clusterIP}'):8000
#
# Each answer says which node's pod gave it. With the agent started
# with `--expose counter=default/web:8000`, the site's "Ask the cluster"
# button sends its visitors' requests here.
#
# Redis keeps its data on the cluster's machine, since a pod's volumes
# live there and not in the tab. Close the tab Redis runs in and
# Kubernetes starts Redis in another tab, where it reads the same file,
# and the count goes on from where it was.
#
# These pods come before the ones that are only there to fill a tab
# (everywhere.yaml): the first tabs to join get Redis and the web
# servers, so the counter works as soon as three tabs are open.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: tab-first
value: 1000
description: Pods that should get a tab before the pods that only fill one.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      runtimeClassName: tab
      priorityClassName: tab-first
      containers:
        - name: redis
          image: redis:alpine
          # Every write goes to the file as it is made, so a tab that
          # closes mid-count loses nothing.
          args: ["--appendonly", "yes", "--appendfsync", "always", "--dir", "/data"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/tabernetes/data/redis
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      runtimeClassName: tab
      priorityClassName: tab-first
      containers:
        - name: web
          image: python:3.13-alpine
          ports:
            - containerPort: 8000
          # The Service sends a pod nothing until the server in it
          # answers: the program is started some seconds before Python
          # is listening.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 1
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - python
            - -u
            - -c
            - |
              # Answers every request with the number of requests so far,
              # kept in Redis, and the node this copy runs on: as a line
              # of text, or as JSON at /json. Redis is spoken to in its
              # own protocol over a socket, so the image needs nothing
              # installed.
              import http.server, json, os, socket

              NODE = os.environ.get("NODE_NAME", "a tab")
              POD = os.environ.get("POD_NAME", "a pod")

              def count():
                  with socket.create_connection(("redis", 6379), timeout=5) as redis:
                      redis.sendall(b"INCR visits\r\n")
                      return int(redis.recv(64).strip()[1:])

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      # The readiness probe's question, which is no visit.
                      if self.path == "/healthz":
                          self.send_response(200)
                          self.send_header("Content-Length", "0")
                          self.end_headers()
                          return
                      try:
                          visit = count()
                      except (OSError, ValueError) as error:
                          self.send_error(503, f"Redis did not answer: {error}")
                          return
                      if self.path == "/json":
                          kind = "application/json"
                          body = json.dumps({"visit": visit, "node": NODE, "pod": POD})
                      else:
                          kind = "text/plain"
                          body = f"visit {visit}, answered by a pod on {NODE}\n"
                      self.send_response(200)
                      self.send_header("Content-Type", kind)
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body.encode())

                  # The probe asks every second, and its lines would be
                  # all there is in the log.
                  def log_message(self, format, *args):
                      if self.path != "/healthz":
                          super().log_message(format, *args)

              print("listening on :8000")
              http.server.HTTPServer(("", 8000), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 8000
