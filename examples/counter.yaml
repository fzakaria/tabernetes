# A counter that every tab serves: a web server on each tab, and the
# Redis they count visits in on one of them.
#
#   kubectl apply -f counter.yaml
#   curl $(kubectl get svc web -o jsonpath='{.spec.clusterIP}'):8000
#
# Each answer says which node's pod gave it, and the pod says so too,
# in its own tab: whoever holds the phone sees a line for every request
# the phone answered. With the agent started with
# `--expose counter=default/web:8000`, the site's "Ask the cluster"
# button sends its visitors' requests here.
#
# The web server is a DaemonSet, so every tab that joins gets one and
# is behind the Service a few seconds later. It is a shell script: the
# image is Alpine's 4 MB and nothing is installed, which matters when
# every phone that joins fetches the files it runs.
#
# Redis keeps its data on the cluster's machine, since a pod's volumes
# live there and not in the tab. Close the tab Redis runs in and
# Kubernetes starts Redis in another tab, where it reads the same file,
# and the count goes on from where it was.
#
# Redis comes before the web servers: a tab has room for one pod, so
# Redis takes a tab from a web server when there is no tab free.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: tab-first
value: 1000
description: Pods that should get a tab before the pods every tab gets.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      runtimeClassName: tab
      priorityClassName: tab-first
      containers:
        - name: redis
          image: redis:alpine
          # Every write goes to the file as it is made, so a tab that
          # closes mid-count loses nothing. Any pod on a tab can reach
          # Redis, and a tab is a stranger's browser, so Redis is told
          # how much it may hold: a stranger can spoil the count and
          # cannot fill the machine.
          args:
            - --appendonly
            - "yes"
            - --appendfsync
            - always
            - --dir
            - /data
            - --maxmemory
            - 64mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/tabernetes/data/redis
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      runtimeClassName: tab
      # A DaemonSet decides which nodes get a pod from the pod's
      # template, before the RuntimeClass adds the tabs' label and
      # toleration to the pod. So the template names both itself, and
      # the cluster's own machine gets no pod.
      nodeSelector:
        tabernetes.dev/tab: "true"
      tolerations:
        - key: tabernetes.dev/tab
          operator: Exists
          effect: NoSchedule
      containers:
        - name: web
          image: alpine:3.22
          ports:
            - containerPort: 8000
          # The Service sends a pod nothing until the server in it
          # answers.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - sh
            - -c
            - |
              # What answers one request: the visit is counted in
              # Redis, spoken to in its own protocol over a socket, and
              # the answer says which node gave it. nc runs this once
              # for each connection, with the connection as its input
              # and output, so what is written to the terminal goes to
              # file descriptor 2.
              cat > /answer <<'ANSWER'
              #!/bin/sh
              read -r method path version
              reply() {
                printf 'HTTP/1.1 %s\r\nContent-Type: %s\r\nContent-Length: %s\r\nConnection: close\r\n\r\n%s' \
                  "$1" "$2" "${#3}" "$3"
              }

              # The readiness probe's question, which is no visit.
              if [ "$path" = /healthz ]; then
                reply "200 OK" text/plain ""
                exit
              fi

              visit=$(printf 'INCR visits\r\nQUIT\r\n' | nc -w 5 redis 6379 | head -n 1 | tr -dc 0-9)
              if [ -z "$visit" ]; then
                reply "503 Service Unavailable" text/plain "Redis did not answer"
                echo "a request came, and Redis did not answer" >&2
                exit
              fi
              if [ "$path" = /json ]; then
                reply "200 OK" application/json "{\"visit\": $visit, \"node\": \"$NODE_NAME\", \"pod\": \"$POD_NAME\"}"
              else
                reply "200 OK" text/plain "visit $visit, answered by a pod on $NODE_NAME
              "
              fi
              echo "visit $visit was answered here, on $NODE_NAME" >&2
              ANSWER
              chmod +x /answer

              echo "Linux $(uname -r) on $(uname -m), booted in the tab that is node $NODE_NAME."
              echo "This pod is a web server behind the cluster's Service \"web\"."
              echo "When someone presses \"Send a request\" on the cluster's page and the"
              echo "Service picks this pod, the request is answered on this device, and a"
              echo "line below says so."
              echo
              exec nc -lk -p 8000 -e /answer
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 8000
