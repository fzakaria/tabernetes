<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A browser tab with a ship's wheel on it, seven spokes as on
       Kubernetes's own, and a green light for a node that is Ready. The
       night sky behind is the site's. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a4190"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="tab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e4ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <g transform="translate(5.7 5.2) scale(2.19)">
    <path d="M1.5 20.5H3a2 2 0 0 0 2-2V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v11.5a2 2 0 0 0 2 2h1.5z" fill="url(#tab)"/>
    <g stroke="#326ce5" stroke-linecap="round" fill="none">
      <circle cx="12" cy="12.4" r="3.6" stroke-width="1.25"/>
      <path stroke-width="1.1" d="M12 12.4V7.1M12 12.4l4.14-3.3M12 12.4l5.17 1.18M12 12.4l2.3 4.78M12 12.4l-2.3 4.78M12 12.4l-5.17 1.18M12 12.4l-4.14-3.3"/>
    </g>
    <circle cx="12" cy="12.4" r="1.25" fill="#326ce5"/>
    <circle cx="19.3" cy="4.9" r="2.5" fill="#6ee7a8" stroke="#16224a" stroke-width="1.1"/>
  </g>
</svg>
