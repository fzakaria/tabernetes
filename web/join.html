<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tabernetes: this tab is a node</title>
    <link rel="icon" href="mark.svg" />
    <link rel="stylesheet" href="site.css" />
  </head>
  <body class="node">
    <main>
      <header class="brand">
        <span class="name"><img src="mark.svg" alt="" /> tabernetes</span>
        <a href="/">the cluster</a>
      </header>

      <p class="node-name mono" id="name">joining</p>
      <p class="status" id="status" data-state="joining">Asking the cluster for a place.</p>

      <section class="pods" id="pods"></section>

      <footer class="node-foot">
        <span id="cluster"></span>
        <button class="button quiet" id="leave" hidden>Leave the cluster</button>
        <button class="button" id="rejoin" hidden>Join again</button>
      </footer>
    </main>
    <script type="module" src="join.js"></script>
  </body>
</html>
