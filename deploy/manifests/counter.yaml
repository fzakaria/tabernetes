# A web server that counts its visits in Redis, each in a browser tab.
#
#   kubectl apply -f counter.yaml
#   kubectl run -it --rm ask --image=curlimages/curl --restart=Never -- curl -s web:8000
#
# Redis keeps its data on the cluster's machine, since a pod's volumes
# live there and not in the tab. Close the tab Redis runs in and
# Kubernetes starts Redis in another tab, where it reads the same file,
# and the count goes on from where it was.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      runtimeClassName: tab
      containers:
        - name: redis
          image: redis:alpine
          # Every write goes to the file as it is made, so a tab that
          # closes mid-count loses nothing.
          args: ["--appendonly", "yes", "--appendfsync", "always", "--dir", "/data"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/tabernetes/data/redis
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      runtimeClassName: tab
      containers:
        - name: web
          image: python:3.13-alpine
          ports:
            - containerPort: 8000
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - python
            - -u
            - -c
            - |
              # Answers every request with the number of requests so far,
              # kept in Redis, and the node this copy runs on. Redis is
              # spoken to in its own protocol over a socket, so the image
              # needs nothing installed.
              import http.server, os, socket

              def count():
                  with socket.create_connection(("redis", 6379), timeout=5) as redis:
                      redis.sendall(b"INCR visits\r\n")
                      return int(redis.recv(64).strip()[1:])

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = f"visit {count()}, answered by a pod on {os.environ.get('NODE_NAME', 'a tab')}\n".encode()
                      self.send_response(200)
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              print("listening on :8000")
              http.server.HTTPServer(("", 8000), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 8000
