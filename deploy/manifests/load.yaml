# A pod for every tab there is room for: a load test, and a way to give
# every phone in a room something to show. Scale it to the number of
# nodes:
#
#   kubectl scale deployment load --replicas=40
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load
  template:
    metadata:
      labels:
        app: load
    spec:
      runtimeClassName: tab
      containers:
        - name: load
          image: alpine:3.22
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -c
            - |
              echo "Linux $(uname -r) on $(uname -m), in the tab that is node $NODE_NAME"
              while true; do date; sleep 10; done
